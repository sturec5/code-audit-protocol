name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    # The job clones and runs two local scripts. Nothing it does needs write
    # access to anything, and stating that is cheaper than relying on whatever
    # the repository default happens to be on the day this goes public.
    permissions:
      contents: read
    steps:
      # Full history: the version-payload check asks when the current version
      # was last set, and the default shallow clone cannot answer that. The
      # check reports DID NOT RUN rather than passing, so a missing fetch-depth
      # fails the build instead of quietly disabling it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 .github/verify.py
      # The gate's own fail-open cases. Its term list is untracked by design,
      # so CI cannot run check.sh against this repository — but it can prove
      # the gate still fails when it should.
      - run: ./check_test.sh
